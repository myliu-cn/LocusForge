[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locusforge"
version = "0.2.0"
description = "Geometry-certified loop-closure video dataset studio"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.1,<3",
  "Pillow>=11.1,<13",
  "python-multipart>=0.0.20,<1",
  "imageio-ffmpeg>=0.6,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[project.scripts]
locusforge = "locusforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
locusforge = ["assets/**/*", "static/**/*", "blender/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["renderer: requires a Blender 4.5 executable"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/locusforge/blender/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/locusforge"]
exclude = ["src/locusforge/blender/"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg"]
ignore_missing_imports = true
